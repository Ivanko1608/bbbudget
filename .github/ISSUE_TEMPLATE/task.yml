name: Task
description: One piece of work, small enough for one pull request.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why this matters to its feature, in one or two sentences. The PR description copies it, so the reviewer never has to come back here.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The facts, and where to look (files, PRs, branches).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable facts. The reviewer tests the pull request against this list.
      value: |
        - [ ]
        - [ ] `make check` passes
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What not to touch, so the change stays one topic.
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: "Filled in as the work goes, one line each: date, what was decided, why, and where (PR or commit)."
      value: None yet.
