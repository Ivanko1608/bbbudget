name: Task
description: One piece of work, small enough for one pull request.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it matters, and where to look (files, PRs, branches).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable facts. The reviewer tests the pull request against this list.
      value: |
        - [ ]
        - [ ] `make check` passes
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What not to touch, so the change stays one topic.
