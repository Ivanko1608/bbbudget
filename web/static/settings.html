<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings · Budget planner</title>
<link rel="preload" href="fonts/golos-text-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231f8a5b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 data-i18n="prefs.title">Settings</h1>
      <p id="status" class="muted" role="status" aria-live="polite" data-i18n="app.loading">Loading…</p>
    </div>
    <div class="top-actions">
      <a class="btn" href="./" data-i18n="prefs.back">← Back to budgets</a>
    </div>
  </header>

  <form id="form" hidden>
    <section aria-labelledby="h-lang">
      <h2 id="h-lang" data-i18n="prefs.language.heading">Language</h2>
      <p class="muted" data-i18n="prefs.language.text"></p>
      <div class="grid settings-grid">
        <label class="f"><span data-i18n="prefs.language.label">Language</span>
          <select name="locale" id="localeSel"></select>
        </label>
      </div>
    </section>

    <section aria-labelledby="h-ai">
      <h2 id="h-ai" data-i18n="prefs.assistant.heading">AI assistant</h2>
      <p class="muted" data-i18n="prefs.assistant.text"></p>
      <div class="grid settings-grid">
        <label class="f"><span data-i18n="prefs.assistant.provider">Assistant</span>
          <select name="assistant_provider">
            <option value="off" data-i18n="prefs.assistant.off">Off</option>
            <option value="anthropic" data-i18n="prefs.assistant.anthropic">Claude</option>
            <option value="openai-compatible" data-i18n="prefs.assistant.local">Local model</option>
          </select>
        </label>
        <label class="f"><span data-i18n="prefs.assistant.model">Model</span>
          <input name="assistant_model" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:prefs.assistant.model_hint">
        </label>
        <label class="f" id="aiUrlRow"><span data-i18n="prefs.assistant.url">Server URL</span>
          <input name="assistant_url" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:11434/v1">
        </label>
      </div>
      <div class="key-row">
        <label class="f"><span><span data-i18n="prefs.assistant.key">API key</span> <span id="aiKeyState"></span></span>
          <input name="assistant_api_key" type="password" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:prefs.assistant.key_placeholder">
        </label>
        <button type="button" id="clearAiKey" class="danger" data-i18n="prefs.assistant.remove_key">Remove key</button>
      </div>
      <p class="muted hint" id="aiStatus"></p>
    </section>

    <section aria-labelledby="h-rates">
      <h2 id="h-rates" data-i18n="prefs.rates.heading">Exchange rates</h2>
      <p class="muted" data-i18n="prefs.rates.text"></p>
      <label class="check"><input type="checkbox" name="fetch_rates"> <span data-i18n="prefs.fetch">Fetch exchange rates from the internet</span></label>
      <p class="muted hint" data-i18n="prefs.fetch_hint"></p>
      <div class="grid settings-grid">
        <label class="f"><span data-i18n="prefs.default_source">Source for new currencies</span>
          <select name="default_rate_source">
            <option value="auto" data-i18n="prefs.source.auto">Auto: ECB, else market data</option>
            <option value="ecb" data-i18n="prefs.source.ecb">ECB (official, fiat only)</option>
            <option value="currency-api" data-i18n="prefs.source.currency-api">currency-api (fiat + crypto)</option>
            <option value="coingecko" data-i18n="prefs.source.coingecko">CoinGecko (crypto only)</option>
            <option value="manual" data-i18n="prefs.source.manual">Typed by hand</option>
          </select>
        </label>
        <label class="f"><span data-i18n="prefs.auto_refresh">Update rates automatically</span>
          <select name="auto_refresh">
            <option value="off" data-i18n="prefs.refresh.off">Off: only when I ask</option>
            <option value="hourly" data-i18n="prefs.refresh.hourly">Every hour</option>
            <option value="daily" data-i18n="prefs.refresh.daily">Every day</option>
          </select>
        </label>
      </div>
      <p class="muted hint" id="autoStatus"></p>
    </section>

    <section aria-labelledby="h-cg">
      <h2 id="h-cg" data-i18n="prefs.cg.heading">CoinGecko API key</h2>
      <p class="muted" data-i18n="prefs.cg.text"></p>
      <div class="key-row">
        <label class="f"><span><span data-i18n="prefs.cg.key">Key</span> <span id="keyState"></span></span>
          <input name="coingecko_api_key" type="password" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:prefs.cg.placeholder">
        </label>
        <button type="button" id="clearKey" class="danger" data-i18n="prefs.cg.remove">Remove key</button>
      </div>
    </section>

    <section aria-labelledby="h-files">
      <h2 id="h-files" data-i18n="prefs.files.heading">Where things are stored</h2>
      <dl class="paths" id="paths"></dl>
    </section>

    <div class="row-actions">
      <button type="submit" class="primary" data-i18n="prefs.save">Save settings</button>
    </div>
  </form>
</main>
<script type="module" src="settings.js"></script>
</body>
</html>
