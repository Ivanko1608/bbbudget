version: "2"

linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - govet
    - staticcheck
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^error\.Error$'
          msg: >-
            error text never goes into a response; add the error to knownErrors
            in internal/httpapi/errors.go with a fixed message
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path-except: ^internal/httpapi/
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo]
      - path: ^cmd/bbbudget/main\.go$
        linters: [errcheck, govet]
      - path: ^internal/app/rates\.go$
        linters: [govet]
      - path: ^internal/httpapi/httpapi\.go$
        linters: [errcheck]
      - path: ^internal/templates/templates\.go$
        linters: [errcheck]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
